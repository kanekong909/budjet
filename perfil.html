<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1e">
  <title>TrackOb — Perfil</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/x-icon" href="./assets/icons/logo.svg">
</head>
<body>

  <header class="header">
    <button class="btn-icon" onclick="window.history.back()" style="background:transparent;color:white">‹</button>
    <div class="header-title">Mi perfil</div>
    <div style="width:40px"></div>
  </header>

  <main class="main">
    <!-- Avatar -->
    <div class="card" style="text-align:center;padding:28px">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--gris-obra);color:var(--amarillo);
                  display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;
                  margin:0 auto 12px;font-family:var(--font-titulo)" id="avatar-letra">?</div>
      <div class="fw-700" style="font-size:1.2rem" id="perfil-nombre">—</div>
      <div class="text-2" id="perfil-email">—</div>
    </div>

    <!-- Info -->
    <div class="card">
      <div class="section-title">Cuenta</div>
        <div class="gasto-item" style="cursor:default">
          <div class="gasto-info">
            <div class="gasto-desc">Nombre</div>
            <div class="gasto-meta" id="info-nombre">—</div>
          </div>
        </div>
        <div class="gasto-item" style="cursor:default">
          <div class="gasto-info">
            <div class="gasto-desc">Correo</div>
            <div class="gasto-meta" id="info-email">—</div>
          </div>
        </div>
        <div class="gasto-item" style="cursor:default;border:none">
          <div class="gasto-info">
            <div class="gasto-desc">Rol</div>
            <div class="gasto-meta" id="info-rol">—</div>
          </div>
        </div>
        <div class="card mt-8" id="card-notif">
          <div class="section-title mb-8">Notificaciones</div>
          <p class="text-2 mb-8">Recibe alertas cada 8 horas cuando tengas tareas pendientes.</p>
          <button class="btn btn-primary w-full" id="btn-notif" onclick="toggleNotificaciones()">
            🔔 Activar notificaciones
          </button>
        </div>
    </div>

    <!-- Cerrar sesión -->
    <div id="card-admin" style="display:none" class="card mb-8">
      <button class="btn btn-primary w-full" onclick="window.location.href='admin.html'">⚙️ Panel de administración</button>
    </div>

    <!-- Fondo personalizable -->
    <div class="card mt-8" id="card-fondo">
      <div class="section-title mb-8">🖼️ Fondo de pantalla</div>
      <p class="text-2 mb-8">Elige un wallpaper o sube tu propia imagen. Recomendado: fotos HD horizontales.</p>

      <!-- Galería predefinida -->
      <div class="section-title" style="font-size:.8rem;margin-bottom:8px">Galería</div>
      <div id="galeria-fondos" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px"></div>

      <!-- Subir imagen propia -->
      <div class="section-title" style="font-size:.8rem;margin-bottom:8px">Tu imagen</div>
      <div class="row" style="gap:10px">
        <button class="btn btn-secundario w-full" onclick="document.getElementById('input-fondo').click()">
          📁 Subir imagen
        </button>
        <button class="btn btn-danger btn-sm" onclick="quitarFondo()" id="btn-quitar-fondo" style="display:none">
          ✕ Quitar
        </button>
      </div>
      <input type="file" id="input-fondo" accept="image/*" style="display:none" onchange="subirFondoPropio(this)">
      
      <!-- Preview -->
      <div id="fondo-preview-wrap" style="margin-top:12px;display:none">
        <img id="fondo-preview-img" style="width:100%;height:120px;object-fit:cover;border-radius:10px">
      </div>
    </div>

    <div class="card">
      <button class="btn btn-danger w-full" onclick="confirmarLogout()">🚪 Cerrar sesión</button>
    </div>

    <p class="text-2" style="text-align:center;margin-top:20px">TrackOb v1.0</p>
  </main>

  <nav class="nav-bottom">
    <button class="nav-btn" onclick="window.location.href='dashboard.html'">
      <span class="icon">
        <img src="./assets/icons/obras.svg" style="width:24px;height:24px;" alt="Obras">
      </span>
      <span>Obras</span>
    </button>
    <button class="nav-btn active">
      <span class="icon">
        <img src="./assets/icons/user.svg" style="width:24px;height:24px;" alt="Perfil">
      </span>
      <span>Perfil</span>
    </button>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/config.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
